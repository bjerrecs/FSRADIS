# Deployment behind Nginx Proxy Manager (or any reverse proxy in Docker).
#
# The proxy reaches this container over a shared Docker network, so:
#   * the target port is 80 -- the container's own port, NOT a published one
#   * no host port is published, so the app is only reachable via the proxy
#
# BEFORE DEPLOYING: replace SET_NPM_NETWORK below with the network your proxy
# container is already on -- either edit the `name:` line directly, or set an
# NPM_NETWORK environment variable on the stack. Find the network with:
#
#   docker ps --format '{{.Names}}' | while read c; do #     printf "%-28s %s
" "$c" #     "$(docker inspect "$c" -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}')"; #   done
#
# The network must already exist; this stack attaches to it rather than creating it.
services:
  fsradis:
    image: ghcr.io/bjerrecs/fsradis:latest
    container_name: fsradis
    restart: unless-stopped
    networks:
      - proxy
    # Optional: edit stand assignments without rebuilding the image.
    # volumes:
    #   - /opt/fsradis/standassignment.txt:/usr/share/nginx/html/standassignment.txt:ro

networks:
  proxy:
    external: true
    name: ${NPM_NETWORK:-SET_NPM_NETWORK}
