server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Kept at server level only -- an `add_header` inside a
    # location would drop every inherited one, so the cache rules below use the
    # `expires` directive instead, which does not clobber inheritance.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Container healthcheck / Portainer probe target.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames here, so they are safe to cache hard.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Stand data is bind-mountable and edited without a rebuild -- never cache.
    location = /standassignment.txt {
        expires -1;
        try_files $uri =404;
    }

    # Never cache the shell, otherwise clients pin an old asset manifest.
    location = /index.html {
        expires -1;
    }

    # ACME challenges and security.txt. `^~` outranks the dotfile regex below,
    # so this stays reachable if the container is ever terminated directly.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Scanners probe /.env, /.git/HEAD and friends constantly. Without this the
    # SPA fallback answers all of them with 200 + index.html, which leaks
    # nothing but does advertise the site as a soft target.
    location ~ /\. {
        access_log off;
        return 404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
